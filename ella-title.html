<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8">
    <title> Late Night Drive </title>

    <link rel="stylesheet" href="ella-title.css">
</head>

<body> 
    <div class="dark-overlay"></div>
    <main class="title-page">
        <h1> LATE NIGHT DRIVE </h1>
        <h2> The Horror Game </h2>
        <img src="monster.png" alt="monster drawing" class="monster">

        <p>
            You are driving home late at night. The road is empty, your stress is rising, and something strange is waiting in the dark...
        </p> 
        <p class="warning"> 
            Keep your stress low. Watch the road. Be careful who you let into your car,
        </p>
        <button oneclick="startGame ()"> START DRIVING </button>
    </main>
    <script src="title.js"></script>
</body>
</html>
