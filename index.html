<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hitchhiker</title>

    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="title.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="title.js" defer></script>
</head>

<body>
    <div class="overlay"></div>

    <main class="title-page">
        <h1>HITCHHIKER</h1>
        <h2>A Horror Game</h2>

        <img src="images/monster.png" alt="monster drawing" class="monster">

        <p class="intro">
            You are driving home late at night. The road is empty, your stress is rising,
            and something strange is waiting in the dark...
        </p>

        <p class="warning">
            Keep your stress low. Watch the road. Be careful who you let into your car.
        </p>

        <button onclick="startGame()">START DRIVING</button>
    </main>

    <script src="ella-title.js"></script>
</body>
</html>
