<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Hitchhiker</title>
    <link href="driving.css" rel="stylesheet" type="text/css">
    
    <!-- Javascript and JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="driving.js" defer></script>
    
    <!-- Imports any fonts from Google Fonts -->
    <!-- Works in the css file too -->
    <style>@import url('https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Rock+Salt&display=swap');</style>
</head>
<body>
  
    <div id="driving">
        <img src="images/steeringWheel.png" id="steeringWheel" class="clickableAsset">
        <img src="images/stickShift.png" id="stickShift" class="clickableAsset">
        <img src="images/leftMirror.png" id="leftMirror" class="clickableAsset">
        <img src="images/rightMirror.png" id="rightMirror" class="clickableAsset">
        <img src="images/gloveBox.png" id="gloveBox" class="clickableAsset">
        <img src="images/brownSplat.png" id="brownSplat">
    </div>

    <div id="prompt">You find yourself idly driving on the road, but a strange sense of dread rises. <br>Adjust your left mirror.</div>

    <div id="dialogue-box">
        <p id="dialogue">
            Hitckhiker: "Hey man, I need a ride. Do ya think you can help me out?"
        </p>

        <div id="choices">
            <button id="pickUp" onclick="pickUp()">Pick Him Up</button>
            <button id="driveAway" onclick="driveAway()">Drive Away</button>
        </div>

        <button id="nextBtn" onclick="nextLine()" style="display:none;">
            Next
        </button>
    </div>

    <div id="gameOver"><button id="restart" onclick="restart()">Restart...</button></div>

    <div id="timer"></div>

    <div id="stressContainer">
        <div id="stressFill">STRESS</div>
    </div>
</body>
</html>
